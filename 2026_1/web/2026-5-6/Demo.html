<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript</title>
    <script src="demo.js"></script>
</head>
<body>
<div class="demo">
    <div class="calculate">
        <input type="number" id="v1" placeholder="请输入第一个数字">
        <br>
        <input type="number" id="v2" placeholder="请输入第二个数字">
        <br>
        <button onclick="getResult()">计算</button>
        <button onclick="reset()">重置</button>
        <br>
        <label>结果为：</label>
        <label id="result">未输入数字</label>
    </div>
</div>
<script>
    function getResult() {
        let v1 = document.getElementById("v1").value;
        let v2 = document.getElementById("v2").value;
        let r = Number(v1) + Number(v2);
        if (v1 === "" || v2 === "") {
            return document.getElementById("result").innerHTML = "请输入数字后再执行计算";
        }
        document.getElementById("result").innerHTML = `${r}`;
    }

    function reset() {
        document.getElementById("result").innerHTML = "";
        document.getElementById("v1").value = "";
        document.getElementById("v2").value = "";
    }
</script>
</body>
</html>
